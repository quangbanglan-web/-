<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .sea { fill: #f0f9ff; }
      .border-rf { fill: #ffffff; stroke: #0284c7; stroke-width: 2.2; stroke-linejoin: round; }
      .district-border { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5,4; }
      .river { fill: none; stroke: #38bdf8; stroke-width: 2; stroke-linecap: round; }
      .lake { fill: #bae6fd; stroke: #0284c7; stroke-width: 1.5; }
      .city-dot { fill: #dc2626; stroke: #ffffff; stroke-width: 2; }
      .city-label { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .region-label { font-family: 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #64748b; letter-spacing: 1px; }
      .sea-label { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-style: italic; fill: #0284c7; }
      .title { font-family: 'JetBrains Mono', 'Segoe UI', sans-serif; font-size: 20px; font-weight: 700; fill: #0369a1; }
      .sub { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" class="sea" />

  <!-- Russian Federation Main Contour -->
  <path d="
    M 210,480 
    L 240,420 L 260,340 L 320,290 L 390,260 L 460,250 L 510,210 
    L 580,240 L 640,290 L 690,260 L 740,280 L 800,240 L 890,230 
    L 980,260 L 1080,250 L 1190,270 L 1290,240 L 1380,250 L 1480,270 
    L 1580,310 L 1660,340 L 1750,380 L 1780,440 L 1740,510 L 1680,550 
    L 1650,620 L 1690,690 L 1630,730 L 1570,700 L 1520,720 L 1460,680 
    L 1380,690 L 1290,730 L 1180,740 L 1080,710 L 980,730 L 880,700 
    L 820,730 L 750,710 L 680,760 L 590,750 L 520,780 L 440,770 
    L 380,740 L 330,710 L 270,680 L 240,620 L 210,550 Z
  " class="border-rf" />

  <!-- Crimea -->
  <path d="M 235,745 L 265,740 L 275,765 L 250,775 L 230,760 Z" class="border-rf" />
  <!-- Kaliningrad Region -->
  <rect x="145" y="440" width="35" height="25" rx="4" class="border-rf" />
  <text x="140" y="432" font-size="10" font-family="Segoe UI" fill="#0284c7">Калининград</text>

  <!-- Sakhalin Island -->
  <path d="M 1670,580 L 1690,590 L 1685,730 L 1665,720 Z" class="border-rf" />
  <!-- Kamchatka Peninsula -->
  <path d="M 1740,430 L 1785,460 L 1795,570 L 1765,610 L 1735,530 Z" class="border-rf" />
  <!-- Kuril Islands -->
  <circle cx="1705" cy="745" r="4" class="border-rf" />
  <circle cx="1725" cy="770" r="4" class="border-rf" />
  <circle cx="1745" cy="795" r="4" class="border-rf" />

  <!-- Novaya Zemlya -->
  <path d="M 780,120 L 810,130 L 790,200 L 760,190 Z" class="border-rf" />

  <!-- Lakes -->
  <!-- Baikal -->
  <path d="M 1190,660 Q 1215,630 1205,580 Q 1190,620 1190,660 Z" class="lake" />
  <text x="1215" y="620" class="city-label" font-size="11">оз. Байкал</text>
  <!-- Ladoga & Onega -->
  <ellipse cx="360" cy="330" rx="18" ry="22" class="lake" />
  <text x="382" y="335" class="city-label" font-size="10">Ладожское</text>
  <ellipse cx="410" cy="325" rx="14" ry="18" class="lake" />

  <!-- Major Rivers -->
  <!-- Volga River -->
  <path d="M 370,420 Q 420,440 460,490 T 490,560 T 480,650 T 460,730" class="river" />
  <text x="495" y="600" class="sea-label" font-size="11">р. Волга</text>

  <!-- Don River -->
  <path d="M 360,560 Q 380,630 340,710" class="river" />

  <!-- Ob & Irtysh Rivers -->
  <path d="M 760,280 Q 740,380 770,480 T 730,620 T 750,710" class="river" />
  <path d="M 730,620 Q 670,660 630,730" class="river" />
  <text x="775" y="470" class="sea-label" font-size="11">р. Обь</text>

  <!-- Yenisey River -->
  <path d="M 960,260 Q 940,380 970,500 T 980,680" class="river" />
  <text x="985" y="490" class="sea-label" font-size="11">р. Енисей</text>

  <!-- Lena River -->
  <path d="M 1290,260 Q 1320,380 1270,500 T 1200,610" class="river" />
  <text x="1295" y="430" class="sea-label" font-size="11">р. Лена</text>

  <!-- Amur River -->
  <path d="M 1390,670 Q 1480,650 1560,670 T 1660,610" class="river" />
  <text x="1470" y="645" class="sea-label" font-size="11">р. Амур</text>

  <!-- Federal Districts Boundaries (dashed) -->
  <line x1="560" y1="230" x2="550" y2="760" class="district-border" /> <!-- Ural border -->
  <line x1="880" y1="230" x2="880" y2="720" class="district-border" /> <!-- Siberia border -->
  <line x1="1200" y1="260" x2="1200" y2="740" class="district-border" /> <!-- Far East border -->

  <!-- Major Cities -->
  <circle cx="340" cy="460" r="5" class="city-dot" />
  <text x="352" y="465" class="city-label">МОСКВА</text>

  <circle cx="335" cy="360" r="4.5" class="city-dot" />
  <text x="345" y="365" class="city-label">Санкт-Петербург</text>

  <circle cx="485" cy="510" r="4" class="city-dot" />
  <text x="495" y="515" class="city-label">Казань</text>

  <circle cx="610" cy="540" r="4" class="city-dot" />
  <text x="620" y="545" class="city-label">Екатеринбург</text>

  <circle cx="810" cy="620" r="4" class="city-dot" />
  <text x="820" y="625" class="city-label">Новосибирск</text>

  <circle cx="990" cy="620" r="4" class="city-dot" />
  <text x="1000" y="625" class="city-label">Красноярск</text>

  <circle cx="1180" cy="670" r="4" class="city-dot" />
  <text x="1190" y="675" class="city-label">Иркутск</text>

  <circle cx="1300" cy="480" r="4" class="city-dot" />
  <text x="1310" y="485" class="city-label">Якутск</text>

  <circle cx="1635" cy="740" r="4" class="city-dot" />
  <text x="1560" y="755" class="city-label">Владивосток</text>

  <!-- Seas & Oceans -->
  <text x="850" y="100" class="sea-label" font-size="16">СЕВЕРНЫЙ ЛЕДОВИТЫЙ ОКЕАН</text>
  <text x="440" y="190" class="sea-label">Баренцево море</text>
  <text x="700" y="210" class="sea-label">Карское море</text>
  <text x="1060" y="200" class="sea-label">Море Лаптевых</text>
  <text x="1390" y="210" class="sea-label">Восточно-Сибирское море</text>
  <text x="1640" y="260" class="sea-label">Чукотское море</text>
  <text x="1780" y="680" class="sea-label" font-size="16">ТИХИЙ ОКЕАН</text>
  <text x="1570" y="520" class="sea-label">Охотское море</text>
  <text x="1600" y="790" class="sea-label">Японское море</text>
  <text x="180" y="730" class="sea-label">Чёрное море</text>
  <text x="440" y="780" class="sea-label">Каспийское море</text>

  <!-- Region Labels -->
  <text x="360" y="620" class="region-label">ЕВРОПЕЙСКАЯ ЧАСТЬ</text>
  <text x="640" y="450" class="region-label">УРАЛ</text>
  <text x="880" y="420" class="region-label">ЗАПАДНАЯ СИБИРЬ</text>
  <text x="1080" y="420" class="region-label">ВОСТОЧНАЯ СИБИРЬ</text>
  <text x="1400" y="470" class="region-label">ДАЛЬНИЙ ВОСТОК</text>

  <!-- Header Card -->
  <rect x="20" y="20" width="1880" height="1040" fill="none" stroke="#0284c7" stroke-width="2" rx="12" />
  <rect x="40" y="40" width="460" height="75" fill="white" fill-opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" rx="8" />
  <text x="60" y="72" class="title">КОНТУРНАЯ КАРТА РОССИИ</text>
  <text x="60" y="96" class="sub">Субъекты, главные реки и города • Для уроков географии</text>
</svg>
