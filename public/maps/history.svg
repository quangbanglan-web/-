<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <style>
      .bg { fill: #fbf8f1; }
      .sea { fill: #eaf2f8; stroke: #93c5fd; stroke-width: 1.5; }
      .land { fill: #fdfaf2; stroke: #78350f; stroke-width: 2; stroke-linejoin: round; }
      .parchment-border { fill: none; stroke: #b45309; stroke-width: 2.5; rx: 12; }
      .ancient-route { fill: none; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 6,4; }
      .river { fill: none; stroke: #0284c7; stroke-width: 2; }
      .site { fill: #991b1b; stroke: #fef3c7; stroke-width: 2; }
      .site-label { font-family: 'Georgia', serif; font-size: 14px; font-weight: bold; fill: #451a03; }
      .area-label { font-family: 'Georgia', serif; font-size: 15px; font-style: italic; fill: #92400e; letter-spacing: 2px; }
      .sea-label { font-family: 'Georgia', serif; font-size: 14px; font-style: italic; fill: #0369a1; }
      .title { font-family: 'Georgia', serif; font-size: 22px; font-weight: bold; fill: #78350f; }
      .sub { font-family: 'Georgia', serif; font-size: 13px; fill: #92400e; }
    </style>
  </defs>

  <rect width="1920" height="1080" class="bg" />

  <!-- Mediterranean & Surrounding Lands -->
  <!-- Europe / Mediterranean North Shore -->
  <path d="
    M 180,360 L 320,320 L 460,330 L 590,380 L 680,480 L 740,560 
    L 820,580 L 890,660 L 930,680 L 890,740 L 820,700 L 780,630 
    L 680,590 L 540,550 L 420,590 L 340,680 L 260,650 L 220,530 Z
  " class="land" />

  <!-- Italian Boot -->
  <path d="M 680,480 L 740,520 L 790,620 L 820,650 L 790,690 L 740,640 L 710,560 Z" class="land" />
  <ellipse cx="730" cy="710" rx="35" ry="20" class="land" /> <!-- Sicily -->

  <!-- Greece, Aegean & Anatolia -->
  <path d="
    M 890,560 L 980,550 L 1080,520 L 1240,510 L 1350,560 L 1380,640 
    L 1280,680 L 1180,670 L 1140,730 L 1080,720 L 1020,680 L 960,690 
    L 920,640 L 910,590 Z
  " class="land" />
  <ellipse cx="1040" cy="750" rx="45" ry="12" class="land" /> <!-- Crete -->
  <ellipse cx="1230" cy="710" rx="25" ry="14" class="land" /> <!-- Cyprus -->

  <!-- North Africa & Egypt -->
  <path d="
    M 180,780 L 380,760 L 580,780 L 720,770 L 860,820 L 1020,830 
    L 1180,820 L 1290,810 L 1380,860 L 1420,950 L 180,950 Z
  " class="land" />

  <!-- Eastern Europe / Ancient Rus (Dnieper, Ilmen) -->
  <path d="
    M 940,160 L 1080,140 L 1220,180 L 1350,220 L 1320,380 L 1240,480 
    L 1080,520 L 980,480 L 920,360 L 910,240 Z
  " class="land" />

  <!-- Mesopotamia & Levant -->
  <path d="
    M 1280,680 L 1350,690 L 1380,770 L 1330,810 L 1280,740 Z
  " class="land" />

  <!-- Rivers -->
  <!-- Nile -->
  <path d="M 1240,950 Q 1230,880 1220,830 L 1180,800 M 1220,830 L 1250,800" class="river" />
  <text x="1245" y="870" class="sea-label" font-size="12">р. Нил</text>

  <!-- Tigris & Euphrates -->
  <path d="M 1290,560 Q 1380,620 1480,720" class="river" />
  <path d="M 1320,540 Q 1420,590 1520,690" class="river" />
  <text x="1390" y="610" class="sea-label" font-size="11">р. Евфрат / Тигр</text>

  <!-- Dnieper ("Путь из варяг в греки") -->
  <path d="M 1080,190 Q 1120,280 1080,380 T 1140,510" class="river" />
  <path d="M 1080,190 Q 1120,280 1080,380 T 1140,510" class="ancient-route" />
  <text x="1090" y="340" class="sea-label" font-size="11">р. Днепр</text>

  <!-- Seas -->
  <text x="760" y="600" class="sea-label" font-size="16">Средиземное море</text>
  <text x="1150" y="560" class="sea-label" font-size="15">Чёрное море (Понт)</text>
  <text x="1450" y="480" class="sea-label" font-size="14">Каспийское море</text>

  <!-- Ancient Historical Centers -->
  <circle cx="750" cy="580" r="5" class="site" />
  <text x="762" y="585" class="site-label">Рим</text>

  <circle cx="980" cy="650" r="5" class="site" />
  <text x="992" y="655" class="site-label">Афины</text>

  <circle cx="1120" cy="550" r="5" class="site" />
  <text x="1132" y="555" class="site-label">Константинополь</text>

  <circle cx="1080" cy="380" r="5" class="site" />
  <text x="1092" y="385" class="site-label">Киев</text>

  <circle cx="1060" cy="220" r="4.5" class="site" />
  <text x="1072" y="225" class="site-label">Новгород</text>

  <circle cx="1210" cy="810" r="5" class="site" />
  <text x="1222" y="815" class="site-label">Александрия</text>

  <circle cx="1440" cy="690" r="5" class="site" />
  <text x="1452" y="695" class="site-label">Вавилон</text>

  <circle cx="1310" cy="740" r="4.5" class="site" />
  <text x="1322" y="745" class="site-label">Иерусалим</text>

  <!-- Area Titles -->
  <text x="580" y="750" class="area-label">КАРФАГЕН</text>
  <text x="1180" y="880" class="area-label">ДРЕВНИЙ ЕГИПЕТ</text>
  <text x="1360" y="660" class="area-label">МЕСОПОТАМИЯ</text>
  <text x="1140" y="300" class="area-label">ДРЕВНЯЯ РУСЬ</text>
  <text x="640" y="440" class="area-label">ГАЛЛИЯ</text>

  <!-- Title Card -->
  <rect x="20" y="20" width="1880" height="1040" class="parchment-border" />
  <rect x="40" y="40" width="460" height="75" fill="#fefce8" stroke="#b45309" stroke-width="1.5" rx="8" />
  <text x="60" y="72" class="title">ИСТОРИЧЕСКАЯ КОНТУРНАЯ КАРТА</text>
  <text x="60" y="96" class="sub">Древний мир и Средневековье • Торговые пути и цивилизации</text>
</svg>
